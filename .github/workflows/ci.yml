name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pytest

      - name: Python Bytecode Syntax Check
        run: |
          python -m compileall implementations/ iterations/ experiments/ p1_training/ tests/

      - name: Build .NET 9 HAL Driver & Benchmark
        run: |
          dotnet build implementations/v3_csharp_net9_hal_sd_flashattention/ESFA.Net9.csproj -c Release
          dotnet run --project implementations/v3_csharp_net9_hal_sd_flashattention/ESFA.Net9.csproj -c Release

      - name: Compile C99 Cycle Engine with GCC
        run: |
          gcc -O3 -std=c99 implementations/v2_c99_cycle_accurate_engine/spike_attention.c -o implementations/v2_c99_cycle_accurate_engine/spike_attn_bench
          ./implementations/v2_c99_cycle_accurate_engine/spike_attn_bench

      - name: Run the Spike-Driven FlashAttention Reference Model
        run: |
          python implementations/v3_csharp_net9_hal_sd_flashattention/sd_flashattention_engine.py

      - name: Run pytest suite
        run: |
          python -m pytest -q tests
